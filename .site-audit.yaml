domain: www.ecommerce-intel.com
site_name: EcommerceIntel

site_type:
  - affiliate-content-site

primary_topics:
  - Ecommerce intelligence tools
  - Ecommerce product research
  - Ecommerce advertising research
  - TikTok Shop analytics

target_audience:
  - Ecommerce operators
  - TikTok Shop sellers
  - Amazon sellers
  - Shopify merchants

business_goals:
  - Organic traffic
  - Affiliate conversion

primary_entities:
  - EcommerceIntel
  - WinningHunter
  - Kalodata
  - FastMoss
  - Minea

content_angles:
  - Real task testing
  - Operator experience
  - Step-by-step workflows

unique_evidence:
  - Human review required

preferred_page_types:
  - review
  - alternative
  - comparison
  - tutorial
  - general

avoid_topics:
  - Unverified tool claims
  - Unverified pricing
  - Generic ecommerce news

avoid_overlap_with: []

keyword_density:
  mode: observation_only
  target: 2%-3%

publishing_thresholds:
  article_score: 90
  site_score: 85

crawl:
  max_pages: 100
  exclude_patterns:
    - "/api/"
    - "/search"

# Optional explicit overrides reduce heuristic ambiguity.
